<!DOCTYPE html>
<html>
  <body>
    <h1>Class names</h1>
    <ul id="list"></ul>
    <script>
      fetch("/names")
        .then((r) => r.json())
        .then((names) => {
          const list = document.getElementById("list");
          names.forEach((name) => {
            const li = document.createElement("li");
            li.textContent = name;
            list.appendChild(li);
          });
        });
    </script>
  </body>
</html>
